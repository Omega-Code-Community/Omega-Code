[package]
name = "OmegaCode"
version = "0.1.0-alpha"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "OmegaCode"
path = "src/main.rs"

[dependencies]
clap = "4.6.1"
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["full"] }
colored = "3.1.1"
indicatif = "0.18.4"
reqwest = { version = "0.13.4", features = ["stream", "json", "multipart", "query"] }
tokio-stream = "0.1.18"
futures = "0.3.32"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
rmcp = "2.2.0"
rusqlite = { version = "0.40.0", features = ["bundled"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
log = "0.4.30"
flexi_logger = "0.31.9"
chrono = "0.4.44"
rust-i18n = "4.1.0"
once_cell = "1.21.4"
ratatui-kit = { version = "0.5.9", features = ["full"] }
sha2 = "0.11.0"
md5 = "0.8.0"
zip = "8.6.0"
flate2 = "1.1.9"
tar = "0.4.46"
thiserror = "2.0.18"
hex = "0.4.3"
dotenv = "0.15.0"
bytes = "1.11.1"
rand = "0.10.1"
retry = "2.2.0"
async-trait = "0.1.89"